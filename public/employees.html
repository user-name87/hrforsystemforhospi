<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموظفون — نظام HR مستشفى الإمام الحسن المجتبى (ع)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hr-theme.css">
<script defer src="assets/hr-shell.js"></script>
<style>
/* LAYOUT — fixed sidebar + offset come from assets/hr-theme.css */


/* ===================== RESET ===================== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal','Segoe UI',Arial,sans-serif;background:#FAF7F7;color:#2A1218;direction:rtl;min-height:100vh;font-size:15px}

/* ===================== TABLE LAYOUT ===================== */



/* ===================== SIDEBAR ===================== */











/* ===================== TOPBAR ===================== */
.topbar{background:#fff;border-bottom:1px solid #EDD8DB;padding:.75rem 1.4rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(92,10,21,.07)}
.topbar-title{font-size:.98rem;font-weight:800;color:#5C0A15}
.topbar-meta{font-size:.73rem;color:#9C7078;margin-top:1px}
.topbar-actions{display:flex;gap:.55rem}

/* ===================== PAGE CONTENT ===================== */
.page-content{padding:1.3rem 1.5rem}

/* ===================== CARDS ===================== */
.card{background:#fff;border:1px solid #EDD8DB;border-radius:14px;box-shadow:0 2px 8px rgba(92,10,21,.07);padding:1rem 1.25rem;margin-bottom:1rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;padding-bottom:.6rem;border-bottom:1px solid #EDD8DB}
.card-title{font-size:.9rem;font-weight:800;color:#8C1320;display:flex;align-items:center;gap:.38rem}

/* ===================== BUTTONS ===================== */
.btn{font-family:'Tajawal',sans-serif;font-weight:700;font-size:.82rem;padding:.48rem 1rem;border-radius:8px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#C01C2C,#8C1320);color:#fff;box-shadow:0 3px 10px rgba(192,28,44,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(192,28,44,.35)}
.btn-ghost{background:#fff;color:#8C1320;border:1px solid #DFC0C5}
.btn-ghost:hover{background:#F5E6E8;border-color:#E8C5CA}
.btn-sm{font-size:.74rem;padding:.33rem .75rem}

/* ===================== FORMS ===================== */
.form-label{display:block;font-size:.75rem;font-weight:700;color:#8C1320;margin-bottom:.3rem}
.form-control{width:100%;font-family:'Tajawal',sans-serif;font-size:.84rem;padding:.48rem .78rem;border:1px solid #DFC0C5;border-radius:8px;background:#fff;color:#2A1218;transition:border .15s,box-shadow .15s;direction:rtl}
.form-control:focus{outline:none;border-color:#C01C2C;box-shadow:0 0 0 3px rgba(192,28,44,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-group{margin-bottom:.8rem}

/* ===================== SEARCH BAR ===================== */
.search-bar{display:flex;gap:.65rem;align-items:flex-end;flex-wrap:wrap}
.search-bar .form-group{margin:0;flex:1;min-width:160px}

/* ===================== TABLE ===================== */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #EDD8DB}
table{width:100%;border-collapse:collapse;font-size:.82rem}
thead th{background:linear-gradient(135deg,#5C0A15,#8C1320);color:#fff;padding:.58rem .8rem;text-align:right;font-weight:700;font-size:.72rem;white-space:nowrap}
tbody tr{border-bottom:1px solid #EDD8DB;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#F5E6E8}
tbody td{padding:.58rem .8rem;color:#5C3840;vertical-align:middle;white-space:nowrap}
.loading-row td{text-align:center;color:#9C7078;padding:2.5rem!important;font-size:.86rem}

/* ===================== SKELETON LOADING ===================== */
@keyframes skeleton-shine{
  0%{background-position:-200px}
  100%{background-position:calc(200px + 100%)}
}
.skeleton-tbody tr{border-bottom:1px solid #EDD8DB;pointer-events:none}
.skeleton-tbody td{padding:.65rem .8rem;vertical-align:middle}
.sk{
  display:inline-block;border-radius:6px;
  background:linear-gradient(90deg,#EDD8DB 0px,#F5E6E8 80px,#EDD8DB 160px);
  background-size:600px 100%;
  animation:skeleton-shine 1.6s infinite linear;
}
.sk-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(90deg,#EDD8DB 0px,#F5E6E8 80px,#EDD8DB 160px);background-size:600px 100%;animation:skeleton-shine 1.6s infinite linear;display:inline-block}
.sk-sm{width:60px; height:14px}
.sk-md{width:110px;height:14px}
.sk-lg{width:160px;height:14px}
.sk-xl{width:90px; height:22px;border-radius:100px}
.sk-badge{width:70px;height:20px;border-radius:100px}

/* ===================== BADGES ===================== */
.badge{display:inline-flex;align-items:center;padding:.17rem .52rem;border-radius:100px;font-size:.68rem;font-weight:700;white-space:nowrap}
.badge-info{background:#E6F3FA;color:#1A6FA0}
.badge-muted{background:#F0ECF0;color:#9C7078}
.badge-success{background:#E8F5EE;color:#2E8B57}
.badge-danger{background:#F5E6E8;color:#C01C2C}
.badge-warning{background:#FEF9E7;color:#B8860B}

/* ===================== PROFILE ===================== */
.profile-hero{background:linear-gradient(135deg,#5C0A15,#8C1320 55%,#C01C2C);border-radius:16px;padding:1.4rem;color:#fff;display:flex;align-items:center;gap:1.1rem;margin-bottom:1rem;box-shadow:0 10px 32px rgba(92,10,21,.2);flex-wrap:wrap;position:relative;overflow:hidden}
.profile-hero::after{content:'👤';position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:4.5rem;opacity:.05;pointer-events:none}
.profile-avatar{width:56px;height:56px;background:rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;border:2px solid rgba(255,255,255,.25);flex-shrink:0}
.profile-name{font-size:1.15rem;font-weight:900;margin-bottom:.18rem}
.profile-meta{font-size:.8rem;opacity:.8}
.profile-id{font-size:.72rem;opacity:.55;margin-top:.12rem;font-family:monospace}
.profile-actions{margin-right:auto;display:flex;gap:.45rem;flex-wrap:wrap}
.btn-white{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);font-family:'Tajawal',sans-serif;font-weight:700;font-size:.76rem;padding:.38rem .85rem;border-radius:8px;border:1px solid rgba(255,255,255,.28);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;transition:all .15s}
.btn-white:hover{background:rgba(255,255,255,.28)}

/* ===================== INFO GRID ===================== */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.6rem;margin-bottom:1rem}
.info-item{background:#FAF7F7;border:1px solid #EDD8DB;border-radius:8px;padding:.6rem .75rem}
.info-lbl{font-size:.64rem;color:#9C7078;font-weight:700;margin-bottom:.12rem;text-transform:uppercase;letter-spacing:.03em}
.info-val{font-size:.88rem;font-weight:700;color:#2A1218}

/* ===================== MONTH ROW ===================== */
.month-row{display:flex;align-items:center;gap:.55rem;margin-bottom:.95rem;flex-wrap:wrap;background:#fff;border:1px solid #EDD8DB;border-radius:8px;padding:.55rem .85rem}
.month-row label{font-size:.76rem;font-weight:700;color:#8C1320}
.month-row select{font-family:'Tajawal',sans-serif;font-size:.8rem;padding:.32rem .6rem;border:1px solid #DFC0C5;border-radius:7px;background:#fff;color:#2A1218}

/* ===================== TABS ===================== */
.tabs-bar{display:flex;border-bottom:2px solid #EDD8DB;margin-bottom:1rem;overflow-x:auto}
.tab-btn{background:none;border:none;padding:.52rem .95rem;font-family:'Tajawal',sans-serif;font-size:.8rem;font-weight:600;color:#9C7078;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s}
.tab-btn:hover{color:#C01C2C}
.tab-btn.active{color:#8C1320;border-bottom-color:#C01C2C;font-weight:800}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ===================== KPI MINI ===================== */
.kpi-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.6rem;margin-bottom:1rem}
.kpi-box{background:#fff;border:1px solid #EDD8DB;border-radius:12px;padding:.72rem .9rem;text-align:center}
.kpi-val{font-size:1.5rem;font-weight:900;color:#8C1320;line-height:1}
.kpi-lbl{font-size:.66rem;color:#9C7078;margin-top:.18rem;font-weight:600}

/* ===================== SHIFT CALENDAR ===================== */
.shift-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:.7rem}
.shift-cal-hdr{text-align:center;font-size:.58rem;font-weight:800;color:#9C7078;padding:.18rem}
.shift-day{border-radius:5px;padding:.26rem .12rem;text-align:center;border:1px solid #EDD8DB;background:#FAF7F7}
.sd-n{font-weight:700;color:#9C7078;font-size:.6rem}
.sd-code{font-weight:800;font-size:.7rem;margin-top:1px}
.s-off{background:#FAF7F7;color:#9C7078}
.s-am{background:#EBF5FB;color:#1A6FA0;border-color:#BDE0F5}
.s-pm{background:#FEF9E7;color:#B8860B;border-color:#F0D080}
.s-night{background:#F0E8F8;color:#7B2DA0;border-color:#D4B0EC}
.s-d12{background:#E8F5EE;color:#2E8B57;border-color:#A8DFC4}
.s-leave{background:#E6F3FA;color:#1A6FA0;border-color:#BDE0F5}

/* ===================== ALERT ITEMS ===================== */
.alert-item{display:flex;align-items:flex-start;gap:.55rem;padding:.55rem .75rem;border-radius:7px;margin-bottom:.42rem;font-size:.8rem}
.alert-item.warn{background:#FEF9E7;color:#B8860B;border:1px solid #F0D080}
.alert-icon{font-size:.92rem;flex-shrink:0;margin-top:2px}
.alert-text{font-weight:700}
.alert-meta{font-size:.68rem;opacity:.7;margin-top:1px}

/* ===================== EMPTY STATE ===================== */
.empty-state{text-align:center;padding:2.2rem 1rem;color:#9C7078}
.empty-icon{font-size:2.4rem;margin-bottom:.55rem;opacity:.32}
.empty-title{font-size:.9rem;font-weight:700;color:#5C3840}
.empty-sub{font-size:.76rem;margin-top:.2rem}
.empty-sub a{color:#C01C2C}

/* ===================== TOAST ===================== */
.toast{position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%) translateY(16px);padding:.6rem 1.25rem;border-radius:12px;font-weight:700;font-size:.84rem;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:#2E8B57;color:#fff}
.toast-danger{background:#C01C2C;color:#fff}

/* ===================== MODAL ===================== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(42,18,24,.55);z-index:500;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:1.45rem;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(92,10,21,.22);max-height:90vh;overflow-y:auto}
.modal-title{font-size:.98rem;font-weight:800;color:#8C1320;margin-bottom:.95rem}</style>
</head>
<body>

<div class="page-wrapper">
  <!-- SIDEBAR CELL -->
  <!-- CONTENT CELL -->
  <div class="content-cell">
    <div class="topbar">
      <div>
        <div class="topbar-title">الموظفون</div>
        <div class="topbar-meta" id="emp-count-lbl">جاري التحميل...</div>
      </div>
      <div class="topbar-actions">
<button class="btn btn-primary btn-sm" onclick="openEmpModal()">+ إضافة موظف</button>
      </div>
    </div>

    <div class="page-content">

      <!-- SEARCH -->
      <div class="card" id="search-section">
        <div class="search-bar">
          <div class="form-group" style="min-width:180px">
            <label class="form-label">القسم</label>
            <select class="form-control" id="search-dep">
              <option value="">-- جميع الأقسام --</option>
            </select>
          </div>
          <div class="form-group" style="flex:2;min-width:200px">
            <label class="form-label">الاسم أو الرقم الوظيفي</label>
            <input type="text" class="form-control" id="search-q" placeholder="ابحث...">
          </div>
          <button class="btn btn-primary" style="margin-bottom:.8rem" onclick="doSearch()">🔍 بحث</button>
        </div>
      </div>

      <!-- LIST -->
      <div id="list-section">
        <div class="card">
          <div class="card-header">
            <div class="card-title">👥 قائمة الموظفين</div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>الرقم الوظيفي</th><th>الاسم</th><th>القسم</th>
                  <th>المسمى الوظيفي</th><th>الشيفت</th><th>الجنسية</th><th></th>
                </tr>
              </thead>
              <tbody id="emp-tbody" class="skeleton-tbody">
                <!-- 8 skeleton rows matching the 7 columns: رقم، اسم، قسم، مسمى، شيفت، جنسية، زر -->
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-lg"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-md"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-lg"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-md"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-sm"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-lg"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-md"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-lg"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-md"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-sm"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-lg"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-md"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
                <tr><td><div class="sk sk-sm"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-badge"></div></td><td><div class="sk sk-lg"></div></td><td><div class="sk sk-xl"></div></td><td><div class="sk sk-sm"></div></td><td></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PROFILE -->
      <div id="profile-section" style="display:none">
        <button class="btn btn-ghost btn-sm" onclick="backToList()" style="margin-bottom:.85rem">← العودة للقائمة</button>

        <div class="profile-hero">
          <div class="profile-avatar">👤</div>
          <div>
            <div class="profile-name" id="prof-name">—</div>
            <div class="profile-meta" id="prof-dept">—</div>
            <div class="profile-id"   id="prof-id">—</div>
          </div>
          <div class="profile-actions">
            <button class="btn-white" onclick="editCurrentEmp()">✏️ تعديل</button>
            <button class="btn-white" onclick="openDisciplinary()">⚖️ إجراء تأديبي</button>
          </div>
        </div>

        <div class="info-grid" id="info-grid"></div>

        <div class="month-row">
          <label>📅 الشهر:</label>
          <select id="prof-month"></select>
          <select id="prof-year"></select>
          <button class="btn btn-primary btn-sm" onclick="loadMonthData()">عرض</button>
          <span id="att-src" style="font-size:.7rem;color:#9C7078;margin-right:auto"></span>
        </div>

        <div class="tabs-bar">
          <button class="tab-btn active" data-tab="summary">📋 ملخص</button>
          <button class="tab-btn" data-tab="schedule">📅 الجدول</button>
          <button class="tab-btn" data-tab="attendance">🕐 الحضور</button>
          <button class="tab-btn" data-tab="overtime">⏱️ الدوام الإضافي</button>
          <button class="tab-btn" data-tab="leaves">🌴 الإجازات</button>
          <button class="tab-btn" data-tab="violations">⚖️ المخالفات</button>
          <button class="tab-btn" data-tab="disciplinary">📋 التأديبية</button>
        </div>

        <div id="tab-summary"      class="tab-panel active"></div>
        <div id="tab-schedule"     class="tab-panel"></div>
        <div id="tab-attendance"   class="tab-panel"></div>
        <div id="tab-overtime"     class="tab-panel"></div>
        <div id="tab-leaves"       class="tab-panel"></div>
        <div id="tab-violations"   class="tab-panel"></div>
        <div id="tab-disciplinary" class="tab-panel"></div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /content-cell -->
</div><!-- /page-wrapper -->

<!-- ADD/EDIT EMPLOYEE MODAL -->
<div class="modal-overlay" id="emp-modal">
  <div class="modal">
    <div class="modal-title" id="emp-modal-title">👤 إضافة موظف جديد</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">الرقم الوظيفي *</label>
        <input type="text" class="form-control" id="em-id" placeholder="مثال: 3055">
      </div>
      <div class="form-group">
        <label class="form-label">الاسم الكامل *</label>
        <input type="text" class="form-control" id="em-name">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">القسم</label>
        <select class="form-control" id="em-dept"></select>
      </div>
      <div class="form-group">
        <label class="form-label">المسمى الوظيفي</label>
        <input type="text" class="form-control" id="em-title">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">نوع الشيفت</label>
        <select class="form-control" id="em-shift">
          <option value="8hr">8 ساعات</option>
          <option value="7hr">7 ساعات</option>
          <option value="12hr">12 ساعة</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">الجنسية</label>
        <input type="text" class="form-control" id="em-nat">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">الراتب الأساسي (دينار)</label>
        <input type="number" class="form-control" id="em-salary" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">نوع العمل</label>
        <select class="form-control" id="em-fullpart">
          <option value="full">دوام كامل</option>
          <option value="part">دوام جزئي</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">التصنيف / التخصص</label>
      <input type="text" class="form-control" id="em-class">
    </div>
    <div style="display:flex;gap:.55rem;justify-content:flex-end;margin-top:.85rem">
      <button class="btn btn-ghost" onclick="closeEmpModal()">إلغاء</button>
      <button class="btn btn-primary" id="save-emp-btn" onclick="saveEmployee()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- VIOLATION MODAL -->
<div class="modal-overlay" id="viol-modal">
  <div class="modal" style="max-width:480px">
    <div class="modal-title">⚖️ تسجيل مخالفة</div>
    <div class="form-group">
      <label class="form-label">نوع المخالفة</label>
      <select class="form-control" id="vt" onchange="updatePenalty()">
        <option value="1">1. التأخير لغاية 15 دقيقة</option>
        <option value="2">2. التأخير 15–30 دقيقة</option>
        <option value="3">3. التأخير 30–60 دقيقة</option>
        <option value="4">4. التأخير أكثر من 60 دقيقة</option>
        <option value="5">5. التأثير على سير العمل</option>
        <option value="6">6. الخروج دون إذن</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">رقم المخالفة (المرة)</label>
        <select class="form-control" id="vo" onchange="updatePenalty()">
          <option value="1">المرة الأولى</option>
          <option value="2">المرة الثانية</option>
          <option value="3">المرة الثالثة</option>
          <option value="4">المرة الرابعة</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">تاريخ الواقعة</label>
        <input type="date" class="form-control" id="vd">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">العقوبة المقترحة</label>
      <input type="text" class="form-control" id="vp" style="background:#FAF7F7">

/* ---- SESSION CACHE ---- */
const SESSION_KEY = 'hr_ws_cache';
const SESSION_TTL = 5 * 60 * 1000; // 5 minutes

function getCachedWorkspace() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > SESSION_TTL) { sessionStorage.removeItem(SESSION_KEY); return null; }
    return data;
  } catch(e) { return null; }
}

function setCachedWorkspace(data) {
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}

/* ---- INIT ---- */
async function init(){
  // ── Load from hr_workspace (attendance system) first ──
  // Try sessionStorage cache before hitting Supabase
  let snap = getCachedWorkspace();
  if (!snap) {
    try { snap = await getWorkspace(); if (snap) setCachedWorkspace(snap); }
    catch(e) { console.error('getWorkspace error:', e); }
  } else {
    console.log('Workspace loaded from session cache');
  }
  
  console.log('Workspace snap:', snap ? 'loaded' : 'null');
  if (snap) console.log('Results count:', snap.results?.length, '| month:', snap.month, snap.year);

  const wsEmps = snap?.results || [];

  if (wsEmps.length) {
    // Map workspace employees using EXACT field names confirmed from debug:
    // sn, nat, days, name, type, deptRaw, deptNorm, deviceId, nameNorm, classification
    const depSet = new Set();
    allEmployees = wsEmps.map(r => {
      const emp  = r.employee || {};
      const dept = (emp.deptNorm || emp.deptRaw || '—').trim();
      if (dept && dept !== '—') depSet.add(dept);
      return {
        employee_id:    String(emp.deviceId || emp.sn || '?'),
        name:           emp.name || emp.nameNorm || '—',
        department_id:  dept,
        departments:    { name: dept },
        job_title:      emp.classification || emp.type || '—',
        shift_type:     detectShiftTypeFromResult(r),
        nationality:    emp.nat || '—',
        basic_salary:   0,
        classification: emp.classification || '—',
        full_or_part:   'full',
        _wsResult:      r,
      };
    }).sort((a,b) => (a.name||'').localeCompare(b.name||'', 'ar'));

    // Merge with DB departments to get email/chairman info
    const { data: dbDeps } = await (await getSb()).from('departments').select('*').order('name');
    const dbDepMap = {};
    (dbDeps||[]).forEach(d => { dbDepMap[d.name] = d; });
    allDepts = Array.from(depSet).map(name => dbDepMap[name] || { id: name, name });

    const snapMonth = snap.month ? MONTHS[parseInt(snap.month)-1] : '';
    const snapYear  = snap.year  || '';
    document.getElementById('emp-count-lbl').textContent =
      `${allEmployees.length} موظف — ${snapMonth} ${snapYear} (نظام الحضور)`;

  } else {
    // Fallback to our employees table
    const [{data:deps},{data:emps}] = await Promise.all([
      (await getSb()).from('departments').select('*').order('name'),
      (await getSb()).from('employees').select('*,departments(name)').order('name'),
    ]);
    allDepts = deps||[]; allEmployees = emps||[];
    document.getElementById('emp-count-lbl').textContent =
      allEmployees.length
        ? `${allEmployees.length} موظف في قاعدة البيانات`
        : '⚠️ لا توجد بيانات — افتح نظام الحضور أولاً';
  }

  // Populate dept selects
  const dSel  = document.getElementById('search-dep');
  const eDept = document.getElementById('em-dept');
  // Clear existing options (keep first placeholder)
  while(dSel.options.length > 1) dSel.remove(1);
  while(eDept.options.length > 1) eDept.remove(1);
  allDepts.forEach(d=>{
    dSel.appendChild(new Option(d.name, d.id || d.name));
    eDept.appendChild(new Option(d.name, d.id || d.name));
  });

  renderTable(allEmployees);

  const pM=document.getElementById('prof-month');
  const pY=document.getElementById('prof-year');
  MONTHS.forEach((m,i)=>{const o=new Option(m,i+1);if(i+1===now.getMonth()+1)o.selected=true;pM.appendChild(o);});
  [2024,2025,2026].forEach(y=>{const o=new Option(y,y);if(y===now.getFullYear())o.selected=true;pY.appendChild(o);});

  // Auto-select workspace month/year if available
  if (snap?.month) document.getElementById('prof-month').value = parseInt(snap.month);
  if (snap?.year)  document.getElementById('prof-year').value  = parseInt(snap.year);
}

  if(dep) f=f.filter(e=>
    String(e.department_id)===dep ||
    e.departments?.name===dep ||
    String(e.department_id)===dep

    e.name?.toLowerCase().includes(q) ||
    e.employee_id?.toLowerCase().includes(q) ||

/* ---- OVERTIME ----
   7/8hr shifts : every minute past the base shift is OT, capped so that
                  base + OT never exceeds MAX_DAILY_HOURS per day.
   12hr shifts  : 17 duty shifts a month are the quota; shift 18 onwards is OT.
   Cash payout  : OT hours / 8 = OT days; OT days x (basic salary / 30). */
const MAX_DAILY_HOURS = 12;
const DUTY_QUOTA_12HR = 17;

function baseShiftHours(shiftType){
  return shiftType==='12hr' ? 12 : shiftType==='7hr' ? 7 : shiftType==='6hr' ? 6 : 8;
}

function otPayout(otHours, salary){
  if (!(salary > 0) || !(otHours > 0)) return 0;
  return Math.round((otHours / 8) * (salary / 30));
}

function otBreakdown(shiftType, otHours, dutyCount, salary){
  const base  = baseShiftHours(shiftType);
  const is12  = shiftType === '12hr';
  const otDays = otHours > 0 ? otHours / 8 : 0;
  const daily  = salary > 0 ? salary / 30 : 0;
  const pay    = otPayout(otHours, salary);
  const rule = is12
    ? `كوتا الشهر ${DUTY_QUOTA_12HR} مناوبة · المناوبات المنجزة ${dutyCount||0} · كل مناوبة بعد الـ${DUTY_QUOTA_12HR} تُحتسب إضافياً (12 ساعة)`
    : `الوردية الأساسية ${base} ساعة · كل دقيقة بعد الأساس إضافي · بحد أقصى ${MAX_DAILY_HOURS} ساعة لليوم (أساس + إضافي)`;
  const payRow = is12 && salary > 0
    ? `<div style="font-size:.8rem;color:#5C3840;line-height:1.9;margin-top:.4rem">
         ${otHours.toFixed(1)} ساعة ÷ 8 = <strong>${otDays.toFixed(2)} يوم</strong> ·
         الراتب الأساسي ${salary.toLocaleString()} ÷ 30 = <strong>${Math.round(daily).toLocaleString()} دينار/يوم</strong> ·
         الاستحقاق النقدي = <strong style="color:#2E8B57">${pay.toLocaleString()} دينار</strong>
       </div>`
    : is12
      ? `<div style="font-size:.78rem;color:#9C7078;margin-top:.4rem">أضف الراتب الأساسي للموظف لحساب الاستحقاق النقدي بدلاً من الإجازة التعويضية.</div>`
      : '';
  return `
    <div class="card" style="margin-bottom:.85rem">
      <div class="card-header"><div class="card-title">⏱️ احتساب الدوام الإضافي</div></div>
      <div style="font-size:.82rem;color:#5C3840;line-height:1.9">
        <div>${rule}</div>
        <div>إجمالي الساعات الإضافية: <strong style="color:#8C1320">${otHours>0?otHours.toFixed(1):0} ساعة</strong></div>
        ${payRow}
      </div>
    </div>`;
}

/* ---- RENDER FROM WORKSPACE RESULT ---- */

  // earlyMinutes, missingPunch, overtimeHours, scheduledHours
  const t   = r.totals   || {};
  const emp = r.employee || {};
  const shiftType = detectShiftTypeFromResult(r);

  // OT is derived from the day records with the hospital's own rules (quota for
  // 12hr, base+12h cap otherwise) so this KPI matches the الدوام الإضافي tab.
  const ot = otRowsFor(wsWorkedDays(r), shiftType);
  const dutyCount = ot.dutyCount;

      <div class="kpi-box">
        <div class="kpi-val" style="color:#C01C2C">${t.absent??0}</div>
        <div class="kpi-lbl">أيام غياب</div>
      </div>
      <div class="kpi-box">
        <div class="kpi-val" style="color:#1A6FA0">${t.leave??0}</div>
        <div class="kpi-lbl">أيام إجازة</div>

        <div class="kpi-val">${t.off??0}</div>

        <div class="kpi-val">${t.workedHours!=null?t.workedHours.toFixed(1):'—'}</div>

      </div>
      <div class="kpi-box">
        <div class="kpi-val" style="color:${(t.lateMinutes||0)>0?'#B8860B':'inherit'}">

        </div>
        <div class="kpi-lbl">دقائق التأخير (${t.lateDays||0} يوم)</div>

      <div class="kpi-box">
        <div class="kpi-val" style="color:${otH>0?'#8C1320':'inherit'}">${otH>0?otH.toFixed(1)+'h':'—'}</div>
        <div class="kpi-lbl">ساعات إضافية</div>

      ${otPay>0?`<div class="kpi-box">
        <div class="kpi-val" style="color:#2E8B57;font-size:1.1rem">${otPay.toLocaleString()}</div>
        <div class="kpi-lbl">مكافأة إضافي (دينار)</div>
      </div>`:''}
      ${shiftType==='12hr'?`
      <div class="kpi-box">
        <div class="kpi-val">${dutyCount}</div>

function renderScheduleFromWs(r, month, year){
  const days=r.employee?.days||{};
  const getDayCode=(d)=> days[d] || days[String(d)] || null;
  const SHIFT_CODES={
    A1:{s:'08:00',e:'16:00',h:8},A2:{s:'07:00',e:'15:00',h:8},
    K:{s:'13:00',e:'21:00',h:8},D:{s:'07:00',e:'19:00',h:12},
    N:{s:'19:00',e:'07:00',h:12},M1:{s:'08:00',e:'20:00',h:12},
    M2:{s:'20:00',e:'08:00',h:12},N1:{s:'21:00',e:'07:00',h:10},
    N2:{s:'22:00',e:'06:00',h:8},M5:{s:'08:00',e:'14:00',h:6},
    P4:{s:'08:00',e:'12:00',h:4},L:{s:'06:00',e:'18:00',h:12},
    L1:{s:'06:00',e:'14:00',h:8}
  };
  const daysInMonth=new Date(year,month,0).getDate();
  const firstDay=new Date(year,month-1,1).getDay();

  document.getElementById('tab-schedule').innerHTML=h;
}

// Worked days of the daily_attendance rows, oldest first, in the OT tab's shape.
function attWorkedDays(att){
  return (att||[])
    .filter(a => a.status === 'present')
    .sort((a,b) => String(a.att_date).localeCompare(String(b.att_date)))
    .map(a => ({ dayNum:+String(a.att_date).slice(-2), code:a.shift_code,
                 workedMin:a.worked_minutes||0, inAt:a.clock_in||null, outAt:a.clock_out||null }));
}

// Worked days of a workspace result, oldest first, in the shape the OT tab wants.
function wsWorkedDays(r){
  return (Array.isArray(r.days) ? r.days : [])
    .filter(d => d && (d.workedHours||0) > 0)
    .sort((a,b) => (a.day||0) - (b.day||0))
    .map(d => ({ dayNum:d.day, code:d.code, workedMin:Math.round((d.workedHours||0)*60),
                 inAt:d.firstPunch||null, outAt:d.lastPunch||null }));
}

function renderOvertimeFromWs(r, month, year){
  renderOvertimeTab(wsWorkedDays(r), detectShiftTypeFromResult(r), month, year);
}

/* ---- OVERTIME TAB ----
   days: [{dayNum, code, workedMin}] already filtered to worked days.
   The day records are the single source of truth: for 12hr employees each worked
   day is one duty shift, so the rows, the total and the duty count all come from
   the same sequence and can never disagree. */
function otRowsFor(days, shiftType){
  const base = baseShiftHours(shiftType) * 60;
  const cap  = MAX_DAILY_HOURS * 60;

  if (shiftType === '12hr'){
    // Every duty shift counts; the ones past the quota are the overtime ones.
    const rows = days.map((d, i) => {
      const n = i + 1;
      const isOt = n > DUTY_QUOTA_12HR;
      return { ...d, otMin: isOt ? 12*60 : 0,
               note:`المناوبة رقم ${n}${isOt?' — بعد الكوتا':''}` };
    });
    return { rows, dutyCount: days.length, otMin: rows.reduce((s,r)=>s+r.otMin, 0) };
  }

  const rows = days.map(d => {
    const ot = Math.max(0, Math.min(d.workedMin||0, cap) - base);
    return { ...d, otMin: ot,
             note:(d.workedMin||0) > cap ? `تجاوز حد ${MAX_DAILY_HOURS} ساعة — احتُسب ${MAX_DAILY_HOURS} فقط` : '' };
  });
  return { rows, dutyCount: days.length, otMin: rows.reduce((s,r)=>s+r.otMin, 0) };
}

// Punch timestamp -> HH:MM, or a dash when the punch is missing.
function otClock(ts){
  if (!ts) return '—';
  const d = new Date(ts);
  return isNaN(d) ? '—' : d.toLocaleTimeString('ar', { hour:'2-digit', minute:'2-digit' });
}

      const sb2={low:'badge-warning',medium:'badge-danger',high:'badge-danger'};
      return`<tr><td>${fDate(a.created_at)}</td><td style="font-weight:700">${a.action_type||'—'}</td>
        <td><span class="badge ${sb2[a.severity]||'badge-muted'}">${sm[a.severity]||'—'}</span></td>
        <td style="font-size:.76rem;max-width:240px;white-space:normal;color:#9C7078">${a.note||'—'}</td></tr>`;
    }).join('')}</tbody></table></div>`}</div>`;
}

/* ---- EMPLOYEE MODAL ---- */
function openEmpModal(emp=null){
  editingEmpId=emp?emp.id:null;
  document.getElementById('emp-modal-title').textContent=emp?'✏️ تعديل بيانات الموظف':'👤 إضافة موظف جديد';
  document.getElementById('em-id').value=emp?.employee_id||'';
  document.getElementById('em-name').value=emp?.name||'';
  document.getElementById('em-dept').value=emp?.department_id||'';
  document.getElementById('em-title').value=emp?.job_title||'';
  document.getElementById('em-shift').value=emp?.shift_type||'8hr';
  document.getElementById('em-nat').value=emp?.nationality||'';
  document.getElementById('em-salary').value=emp?.basic_salary||'';
  document.getElementById('em-fullpart').value=emp?.full_or_part||'full';
  document.getElementById('em-class').value=emp?.classification||'';
  document.getElementById('emp-modal').classList.add('open');
}
function closeEmpModal(){document.getElementById('emp-modal').classList.remove('open');}
function editCurrentEmp(){if(currentEmp)openEmpModal(currentEmp);}

async function saveEmployee(){
  const empId = document.getElementById('em-id').value.trim();
  const name  = document.getElementById('em-name').value.trim();
  if(!empId||!name){alert('الرقم الوظيفي والاسم مطلوبان');return;}

  const deptVal  = document.getElementById('em-dept').value||null;
  const shiftType = document.getElementById('em-shift').value;
  const natVal   = document.getElementById('em-nat').value.trim();
  const salaryVal = +document.getElementById('em-salary').value||0;
  const partVal  = document.getElementById('em-fullpart').value;
  const titleVal = document.getElementById('em-title').value.trim();
  const classVal = document.getElementById('em-class').value.trim();

  // Try to get numeric department_id if dept is a name not an id
  let deptId = null;
  const matchDept = allDepts.find(d => d.name === deptVal || String(d.id) === deptVal);
  if (matchDept && typeof matchDept.id === 'number') deptId = matchDept.id;

  const payload = {
    employee_id:    empId,
    name,
    department_id:  deptId,
    job_title:      titleVal,
    shift_type:     shiftType,
    nationality:    natVal,
    basic_salary:   salaryVal,
    full_or_part:   partVal,
    classification: classVal,
  };

  const btn = document.getElementById('save-emp-btn');
  btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...';

  let error;
  if(editingEmpId){
    ({error} = await (await getSb()).from('employees').update(payload).eq('id', editingEmpId));
  } else {
    ({error} = await (await getSb()).from('employees').insert(payload));
  }

  btn.disabled = false; btn.textContent = '💾 حفظ';

  if(error){ alert('خطأ في الحفظ: '+error.message); return; }

  // If salary was entered, update the workspace employee's display too
  if(salaryVal > 0 && !editingEmpId) {
    // Store salary note in notifications for reference
    await (await getSb()).from('notifications').insert({
      employee_id: empId, kind:'salary_note',
      title:`راتب ${name}`, detail:`${salaryVal} دينار`, status:'info'
    }).catch(()=>{});
  }

  closeEmpModal();
  toast('✅ تم الحفظ بنجاح', 'success');
  // Invalidate both in-memory and session cache so init() re-reads fresh data
  _wsCache = null;
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
  await init();
  if(editingEmpId && currentEmp) openEmployee(currentEmp.employee_id);
}

/* ---- VIOLATION MODAL ---- */
function openViolModal(){document.getElementById('viol-modal').classList.add('open');}
function closeViolModal(){document.getElementById('viol-modal').classList.remove('open');}
function updatePenalty(){
  const r=+document.getElementById('vt').value,o=+document.getElementById('vo').value-1;
  const v=VT.find(x=>x.r===r);
  document.getElementById('vp').value=v?(v.p[o]||'—'):'—';
}
async function saveViolation(){
  if(!currentEmp)return;
  const r=+document.getElementById('vt').value,o=+document.getElementById('vo').value;
  const v=VT.find(x=>x.r===r);
  const {error}=await (await getSb()).from('violations').insert({
    employee_id:currentEmp.employee_id,violation_category:v?.d||'—',
    violation_row:r,occurrence_number:o,penalty:document.getElementById('vp').value,
    incident_date:document.getElementById('vd').value||null,notes:document.getElementById('vn').value.trim()});
  if(error){alert('خطأ: '+error.message);return;}
  closeViolModal();document.getElementById('vn').value='';
  toast('✅ تم تسجيل المخالفة','success');await loadMonthData();
}

function openDisciplinary(){
  if(!currentEmp)return;
  sessionStorage.setItem('disciplinaryActionPayload',JSON.stringify({
    empId:currentEmp.employee_id,empName:currentEmp.name,
    department:currentEmp.departments?.name||'',nationality:currentEmp.nationality||''}));
  window.open('disciplinary-action.html','_blank','width=900,height=680');
}
window.addEventListener('message',async e=>{if(e.data?.type==='disciplinary_saved')await loadMonthData();});

/* ---- HELPERS ---- */
function getDates(from,to){
  const d=[],s=new Date(from),e=new Date(to);
  for(let x=new Date(s);x<=e;x.setDate(x.getDate()+1))d.push(x.toISOString().slice(0,10));
  return d;
}
